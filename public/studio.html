<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#242424"><meta name="apple-mobile-web-app-capable" content="yes">
<title>String Art Studio</title>
<style>
:root{--bg:#242424;--bar:#323232;--pn:#2b2b2b;--fl:#3d3d3d;--ink:#e8e8e8;--mut:#9b9b9b;--acc:#2f6fe4;--ln:#474747;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.3 -apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}svg{width:24px;height:24px;pointer-events:none;flex:none}
#home{display:flex;height:100%}#sb{width:250px;background:#1f1f1f;padding:14px 12px;display:flex;flex-direction:column;gap:2px;flex:none}
.ni{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:8px;width:100%;text-align:left;font-size:16px;color:#ddd}.ni.on{background:#434343}
.sec{font-size:12px;color:var(--mut);margin:18px 14px 6px;letter-spacing:.04em}.fill{flex:1}
#hm{flex:1;overflow:auto;padding:22px 28px}#hero{border-radius:28px;padding:22px 26px 28px;background:linear-gradient(135deg,#3b6a52,#173d6e 50%,#0e2a55)}
#hero h2{margin:0 0 14px;font-size:21px}#tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:rgba(255,255,255,.11);border-radius:16px;height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:17px;color:#d6dde8}.tile svg{width:48px;height:48px;stroke-width:1.2}
h3{font-size:21px;margin:30px 0 14px}.rec{display:flex;gap:16px;flex-wrap:wrap}.rc{width:210px;position:relative;text-align:left}.rc img,.rc .ph{width:100%;height:130px;object-fit:cover;border-radius:14px;background:#34495e;display:block}.rc b{display:block;margin-top:6px;font-weight:600}.rc small{color:var(--mut)}
.rc .x{position:absolute;top:6px;right:6px;background:#000a;border-radius:50%;width:26px;height:26px;font-size:15px}.hint{color:var(--mut);line-height:1.5}
#ed{height:100%;display:flex;flex-direction:column;position:relative}#top{height:52px;background:var(--bar);display:flex;align-items:center;gap:2px;padding:0 8px;overflow-x:auto;flex:none;scrollbar-width:none;z-index:9}
.tb{width:44px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;position:relative;flex:none;color:#c4c4c4}.tb.on{background:var(--acc);color:#fff}
.tb.g::after{content:"";position:absolute;right:3px;bottom:3px;border:3.5px solid transparent;border-right-color:currentColor;border-bottom-color:currentColor}
#cs{width:34px;height:34px;border-radius:50%;border:2px solid #777;margin:0 6px;flex:none}.gap{flex:1;min-width:6px}
#stage{position:relative;flex:1;min-height:0;background:#181818;touch-action:none;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#lpn{position:absolute;left:0;top:14%;width:58px;background:var(--bar);border-radius:0 12px 12px 0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:5}
#grip{width:30px;height:12px;display:flex;align-items:center}#grip i{display:block;width:100%;height:4px;border-radius:2px;background:#666}
.pill{width:42px;height:64px;border-radius:21px;color:#ddd;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 0 9px;background:linear-gradient(#1f1f1f var(--r),#777 var(--r))}.pill.on{outline:2px solid var(--acc)}
.lb{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:#ccc}.lb.on{background:var(--acc)}.lb:disabled{opacity:.35}.hr{width:30px;height:1px;background:#555}
#lpn.c>:not(#grip){display:none}#lpn.c{padding:8px 4px}
#pop{position:absolute;left:66px;z-index:6;display:flex;gap:12px}.vs{width:56px;height:216px;background:#232323;border-radius:10px;position:relative;touch-action:none;box-shadow:0 4px 16px #0008}
.vs i{position:absolute;left:26px;top:14px;bottom:14px;width:4px;border-radius:2px;background:#555}.vs u{position:absolute;left:26px;bottom:14px;width:4px;border-radius:2px;background:#ccc}.vs b{position:absolute;left:14px;width:28px;height:28px;border:3px solid #ccc;border-radius:50%;background:#232323;margin-bottom:-14px}
.pv{width:216px;height:216px;background:#6d6d6d;border-radius:10px;box-shadow:0 4px 16px #0008;display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:6px;font-size:16px}.pv em{background:#222;border-radius:7px;padding:4px 10px;font-style:normal;margin-left:6px}.pv .d{margin:auto;background:#111;border-radius:50%}
#rail{position:absolute;right:0;top:0;bottom:0;width:54px;background:var(--bar);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:6px;z-index:7}.rb{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#ccc}.rb.on{background:#4a4a4a}
#rp{position:absolute;right:54px;top:0;bottom:0;width:min(330px,calc(100% - 54px));background:var(--pn);overflow:auto;padding:14px 16px 24px;z-index:6;border-left:1px solid var(--ln)}
#rp h2{margin:0 0 6px;font-size:19px}#rp h4{margin:0;padding:14px 0 6px;font-size:16px;border-top:1px solid var(--ln)}#rp h4:first-of-type{border:0}
.r{display:flex;justify-content:space-between;align-items:center;min-height:42px;gap:10px;color:#ccc}.sw{width:52px;height:30px;border-radius:15px;background:#444;position:relative;flex:none;cursor:pointer}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#bbb;transition:.15s}.sw.on{background:#bbb}.sw.on::after{left:25px;background:#111}
.bt{background:var(--fl);border-radius:9px;padding:10px 12px;min-height:42px;display:inline-flex;align-items:center;gap:8px;justify-content:center}.bt.on{background:var(--acc);color:#fff}.bt.w{width:100%;margin:4px 0}.g2{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.g2 .bt{flex:1;min-width:84px}
#rp input[type=range],#pv input[type=range]{width:100%;accent-color:var(--acc)}.cols{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.cd{width:34px;height:34px;border-radius:50%;border:2px solid #666}.cd.on{box-shadow:0 0 0 2px var(--acc);border-color:#fff}
textarea,input[type=text]{width:100%;background:#1f1f1f;color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace;user-select:text;-webkit-user-select:text}
#ls{position:absolute;right:62px;bottom:200px;background:var(--bar);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;z-index:6;max-height:80%;overflow:auto;box-shadow:0 4px 16px #0008}
.th{width:60px;height:60px;border-radius:7px;border:2px solid #666;background:repeating-conic-gradient(#e6e6e6 0 25%,#fafafa 0 50%) 0 0/16px 16px;position:relative;flex:none;overflow:hidden}.th.on{border-color:#4d8dff}.th.h canvas{opacity:.3}.th .ey{position:absolute;left:2px;top:2px;width:22px;height:22px;background:#000c;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;z-index:2}.th .ey svg{width:14px;height:14px}.th canvas{position:absolute;inset:0;width:100%;height:100%}.th s{position:absolute;right:2px;bottom:2px;width:18px;height:18px;border-radius:50%;background:#000b;font-size:11px;text-decoration:none;display:flex;align-items:center;justify-content:center}
#lm{position:absolute;right:140px;background:#232323;border-radius:12px;padding:10px 6px;width:236px;z-index:8;box-shadow:0 6px 24px #000a}#lm h5{margin:4px 14px 8px;font-size:16px}
.mi{display:flex;align-items:center;gap:14px;padding:11px 14px;width:100%;text-align:left;font-size:15px;color:#d8d8d8;border-radius:8px}.mi.dim{opacity:.4}.mi.sep{border-top:1px solid #444;border-radius:0;margin-top:4px;padding-top:12px}
#pv{position:absolute;top:6px;z-index:12;background:#262626;border-radius:12px;padding:16px;width:290px;box-shadow:0 8px 30px #000b;max-height:calc(100% - 20px);overflow:auto}#pv h5{margin:0 0 8px;font-size:18px}#pv .sub{color:var(--mut);font-size:12px}
#pv hr{border:0;border-top:1px solid #444;margin:12px -16px}.mrow{display:flex;gap:10px;margin:8px 0;align-items:center;justify-content:space-between}.sq{width:50px;height:42px;border:1px solid #555;border-radius:8px;display:flex;align-items:center;justify-content:center}
#ed.fs #lpn,#ed.fs #rail,#ed.fs #rp,#ed.fs #ls,#ed.fs #lm{display:none}#ed.fs #top>*:not(#fsb){display:none}#ed.fs #top{position:absolute;right:0;top:0;width:auto;background:#3238;border-radius:0 0 0 12px}
#modal{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}#modal>div{background:#262626;border-radius:16px;padding:18px;width:min(440px,100%);max-height:90%;overflow:auto}#modal img{max-width:100%;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111e;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}#toast.on{opacity:1}
@media(max-width:760px){#home{flex-direction:column}#sb{width:100%;flex-direction:row;overflow-x:auto;padding:8px}.ni{width:auto;white-space:nowrap}.sec{display:none}.fill{display:none}#hm{padding:14px}}
#xtop{position:absolute;top:0;left:0;right:0;height:52px;background:var(--bar);display:flex;align-items:center;padding:0 10px;gap:4px;z-index:20}.xb{padding:8px 14px;font-size:17px}.xb.mut{color:#999}#xd{font-weight:600}.vl{width:1px;height:26px;background:#555;margin:0 6px}
#dp{position:absolute;right:76px;bottom:30px;width:150px;height:150px;z-index:6}#dp button{position:absolute;width:48px;height:48px;border-radius:50%;background:#555;display:flex;align-items:center;justify-content:center}
#txb{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;width:min(480px,calc(100% - 140px));background:#262626;border-radius:12px;padding:10px;display:flex;gap:8px;z-index:6;box-shadow:0 6px 20px #000b}#txb textarea{flex:1;font:16px system-ui;height:56px}
.lb2{width:54px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#ccc;padding:6px 0;border-radius:8px}.lb2.on{color:#fff}.lb2.on svg{background:var(--acc);border-radius:8px;padding:4px;width:34px;height:34px}.lb2 svg{padding:4px;width:34px;height:34px}
.bh{font-size:19px;font-weight:600;padding:2px 4px 10px}.bcols{display:flex;gap:10px;height:380px}.bl{width:160px;overflow:auto}.brr{flex:1;overflow:auto}.bl button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:7px}.bl button.on{background:#555;outline:1px solid #888}.bl h6{margin:12px 6px 4px;color:#888;font-size:12px}
.bi{display:block;width:100%;text-align:left;border:1px solid #444;border-radius:9px;padding:8px 10px;margin-bottom:8px}.bi.on{border-color:#4d8dff;color:#6aa6ff}.bi canvas{width:100%;height:40px;display:block}
.tabs{display:flex;border-bottom:1px solid #444;margin-bottom:8px}.tabs button{flex:1;padding:10px}.tabs .on{border-bottom:2px solid #fff}
#shg{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-height:420px;overflow:auto}#shg button{height:100px;background:#bbb;border-radius:9px;padding:12px}
.fi{display:block;width:100%;text-align:left;padding:6px 6px;border-radius:7px}.fi small{display:block;color:#aaa;font-size:13px}.fi span{font-size:26px;display:block;line-height:1.3;color:#eee;overflow:hidden;white-space:nowrap}.fi.on{background:#2f4f8f}
#dlg{position:fixed;inset:0;z-index:55;background:#232323;display:flex;padding-top:env(safe-area-inset-top)}#dl{flex:1;overflow:auto;padding:28px 34px}#dr{width:340px;border-left:1px solid #3a3a3a;padding:20px 22px 90px;overflow:auto;position:relative;flex:none}
#dl .tabs{display:flex;gap:26px;border:0;margin-bottom:22px}#dl .tabs button{flex:none;padding:6px 0;font-size:19px;color:#999}#dl .tabs .on{color:#fff;border-bottom:2px solid #fff}
.pg{display:flex;gap:26px;flex-wrap:wrap}.pre{width:140px;text-align:center;font-size:15px}.pre i{display:flex;align-items:center;justify-content:center;border:2px solid #777;margin:0 auto 10px;min-width:40px;min-height:40px}.pre.on i,.pre.on b{border-color:#4d8dff;color:#6aa6ff}.pre small{display:block;color:#888}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}.tc{background:none;border:1px solid #444;text-align:center;padding:12px 10px;border-radius:4px}.tc.on{border-color:#4d8dff}.tc canvas{width:100%;aspect-ratio:1;background:#0c0b0a;border-radius:4px}.tc b{display:block;margin-top:10px}.tc small{display:block;color:#999;margin-top:3px}
#dr .dh{display:flex;justify-content:space-between;font-size:20px;font-weight:600;margin-bottom:14px}#dr input[type=text],#dr input[type=number],#dr select{width:100%;background:#2b2b2b;color:var(--ink);border:1px solid #555;border-radius:8px;padding:11px;font:inherit}#dr .mrow input,#dr .mrow select{width:150px}#dr .mrow{margin:14px 0}
.cbtn{position:absolute;right:22px;bottom:24px;background:var(--acc);color:#fff;border-radius:26px;padding:15px 26px;font-size:18px;font-weight:600}
@media(max-width:760px){#dlg{flex-direction:column-reverse}#dr{width:100%;border:0;max-height:55%}#dl{padding:14px}}
#mchip{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;font-size:13px}.th em{position:absolute;left:2px;bottom:2px;font-size:9px;font-style:normal;background:#000b;border-radius:4px;padding:1px 3px}#lm{max-height:calc(100% - 12px);overflow:auto}#modal input[type=number]{background:#1f1f1f;color:#eee;border:1px solid #555;border-radius:8px;padding:8px;font:inherit}</style></head><body>
<div id="home"><nav id="sb"></nav><main id="hm"></main></div>
<div id="ed" hidden>
 <header id="top"></header><header id="xtop" hidden></header>
 <div id="stage"><canvas id="cv"></canvas>
  <div id="lpn"></div><div id="pop" hidden></div>
  <div id="ls"></div><div id="lm" hidden></div>
  <div id="rp" hidden></div><div id="rail"></div><div id="pv" hidden></div><div id="dp" hidden></div><div id="txb" hidden></div><button id="mchip" class="bt on" hidden>Editing mask: Eraser hides, Pen reveals. Tap to finish</button>
 </div></div>
<div id="toast"></div><div id="modal" hidden></div>
<input type="file" id="fi" hidden accept="image/*,.json,application/json"><input type="file" id="fsvg" hidden accept=".svg,image/svg+xml">
<script src="studio.js"></script></body></html>
