name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # After you commit package-lock.json you can switch this to `npm ci`.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:catalog
      - run: npm run test:qa
      - run: npm run build
